<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21132d"><title>Leonida Atlas | ERACLE</title><link rel="icon" href="assets/gta-vi.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="photos.css"><link rel="stylesheet" href="atlas.css"></head><body>
<header><div class="brand"><img id="logo" src="assets/gta-vi.png" alt="Grand Theft Auto VI"><span></span><strong>LEONIDA SOSA</strong></div><nav aria-label="Filtri rapidi"><button data-scope="photo" aria-label="Con foto" title="Con foto" aria-pressed="false"><i data-i="camera"></i><span>Con foto</span></button><button data-scope="saved" aria-label="Preferiti" title="Preferiti" aria-pressed="false"><i data-i="star"></i><span>Preferiti</span></button><button data-scope="found" aria-label="Trovati" title="Trovati" aria-pressed="false"><i data-i="tick"></i><span>Trovati</span></button></nav><button id="info" class="info"><i data-i="info"></i><span>Info atlante</span></button></header>
<main><aside><div class="hero"><div class="eyebrow"><span class="dash"></span> GRAND THEFT AUTO VI</div><h1>LEONIDA <em>Atlas</em></h1><p>Esplora la mappa interattiva di GTA VI.</p></div>
<div class="panel"><div class="explorehead"><h2>Esplora gli spot</h2></div><label class="search"><i data-i="search"></i><input id="query" type="search" autocomplete="off" placeholder="Cerca uno spot…" aria-label="Cerca uno spot"></label>
<div class="sectionhead"><h2>Categorie</h2></div><div id="categories"></div>
<div class="sectionhead modes"><h2>Stile mappa</h2><i data-i="layers"></i></div>
<div class="themes"><button data-theme="sunset" class="selected"><span class="check">✓</span><i data-i="sun"></i><b>Sunset</b></button><button data-theme="night"><span class="check">✓</span><i data-i="moon"></i><b>Vice Night</b></button></div></div>
<div class="toolDock" id="dock" role="group" aria-label="Strumenti mappa"><div class="toolGroup"><button data-tool="zones" aria-label="Zone e città" data-tip="Zone e città"><i data-i="navigation"></i></button><button data-tool="ruler" aria-label="Misura distanza" data-tip="Misura distanza"><i data-i="ruler"></i></button><button data-tool="random" aria-label="Spot casuale" data-tip="Spot casuale"><i data-i="spark"></i></button></div><button data-tool="new" aria-label="Crea nuovo spot" data-tip="Crea nuovo spot"><i data-i="pinplus"></i></button></div></aside><section id="mapframe" aria-label="Mappa di Leonida"><div id="carto"></div>
<div class="maphead"><span class="live"></span><b id="visible"></b><span id="wantedStars" hidden>★★★★★</span></div><button id="expand" class="float" aria-label="Espandi la mappa"><i data-i="expand"></i></button>
<button id="mobileSearch" class="float" aria-label="Cerca sulla mappa"><i data-i="search"></i></button><div id="toolBanner" hidden><span id="toolText" role="status"></span><button id="undo" hidden aria-label="Annulla ultimo punto">↶</button><button id="stop" aria-label="Termina strumento"><i data-i="x"></i></button></div><div class="maptools" role="group" aria-label="Controlli zoom"><button id="minus" aria-label="Riduci zoom">−</button><span id="zoomLevel" title="Livello di zoom"></span><button id="plus" aria-label="Aumenta zoom">+</button><span class="zoomDivider"></span><button id="reset" aria-label="Centra la mappa"><i data-i="target"></i></button></div>
<div class="mapfoot"><b>GPS</b><span id="gps">X 0 · Y 0</span><i></i><b>TROVATI</b><span id="foundCount"></span></div><div class="compass" aria-hidden="true"><b>N</b><span>➤</span></div>
<section id="drawer" hidden><div class="drawerhead"><h2 id="drawerTitle"></h2><button id="drawerClose" aria-label="Chiudi"><i data-i="x"></i></button></div><div id="drawerBody"></div></section></section></main>
<footer><span><i data-i="map"></i> Cartografia <strong>Yanis V17</strong></span><span class="signature">ERACLE <b>✦</b> ATLAS</span><button id="credits">Crediti e fonti <i data-i="arrow"></i></button></footer>
<dialog id="modal"><div class="drawerhead"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Chiudi"><i data-i="x"></i></button></div><div id="modalBody"></div></dialog><div id="toast" role="status"></div>
<script src="assets/spots.js"></script><script src="map.js"></script><script src="photos.js"></script><script src="ui.js"></script></body></html>
